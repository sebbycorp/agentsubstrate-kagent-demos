# A second template, pinned to the version the customer is NOT on, so the two
# can be compared side by side. PYTHON_IMAGE is filled in by run.sh.
apiVersion: api.kagent.dev/v1alpha3
kind: SandboxTemplate
metadata:
  name: python311
  namespace: kagent
spec:
  workload:
    image: ${PYTHON_IMAGE}
  env:
    - name: LANG
      value: C.UTF-8
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
